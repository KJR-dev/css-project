<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Show Website</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main>
            <section class="images_section">
                <aside>
                    <img src="./assets/side_image1.png" alt="Side image 1" />
                    <img src="./assets/side_image2.png" alt="Side image 2" />
                    <img src="./assets/side_image3.png" alt="Side image 3" />
                    <img src="./assets/side_image4.png" alt="Side image 4" />
                    <img src="./assets/side_image5.png" alt="Side image 5" />
                    <img src="./assets/side_image6.png" alt="Side image 6" />
                </aside>
                <section class="image_container">
                    <img src="./assets/center_image.png" alt="Center image" />
                </section>
            </section>
            <section class="content">
                <div class="content_header">
                    <p class="green-text">Sustainable Materials</p>
                    <h1>Nike Revolution 8</h1>
                    <h2>Men’s Road Running Shoes</h2>
                </div>
                <section class="price_section">
                    <h2>MRP - $0.00</h2>
                    <div>
                        <p>Inclusive of all taxes</p>
                        <p>Also includes all applicable duties</p>
                    </div>
                </section>
                <section class="variants_section">
                    <img src="./assets/variant1.png" alt="Variant 1" />
                    <img src="./assets/variant2.png" alt="Variant 2" />
                    <img src="./assets/variant3.png" alt="Variant 3" />
                    <img src="./assets/variant4.png" alt="Variant 4" />
                </section>
                <section class="size_section">
                    <div class="size_header">
                        <h4>Select Size</h4>
                        <h4>Size Guide</h4>
                    </div>
                    <section class="sizes">
                        <div class="size">UK 6</div>
                        <div class="size">UK 6.5</div>
                        <div class="size">UK 7</div>
                        <div class="size">UK 7.5</div>
                    </section>
                </section>

                <section class="button_container">
                    <div class="add_to_bag">Add to Bag</div>
                    <div class="wishlist">Favourite</div>
                </section>
            </section>
        </main>
    </body>
</html>
