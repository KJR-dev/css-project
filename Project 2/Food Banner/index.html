<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Food Banner</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <main>
            <div class="image_container">
                <img src="./assets/bg_image.png" alt="Background image" />
            </div>
            <div class="content">
                <img src="./assets/burger.png" class="burger" alt="burger" />
                <img src="./assets/tomato.png" class="tomato1" alt="tomato 1" />
                <img src="./assets/tomato.png" class="tomato2" alt="tomato 2" />
                <img src="./assets/pizza.png" class="pizza" alt="pizza" />
                <img src="./assets/momo.png" class="momo" alt="momo" />
                <img src="./assets/leaf.png" class="leaf" alt="leaf" />
                <div class="center-content">
                    <section class="text-content">
                        <h1>
                            Better food
                            <br />
                            for more people
                        </h1>
                        <p>For over a decade, we’ve enabled our customers to discover new tastes, delivered right to their doorstep</p>
                    </section>
                    <section class="info-section">
                        <div class="info-item">
                            <img src="./assets/house.png" alt="Restaurant Icon" class="info-icon" />
                            <div class="info-text">
                                <span class="info-number">3,00,000+</span>
                                <span class="info-lebel">Restaurant</span>
                            </div>
                        </div>

                        <div class="info-item">
                            <img src="./assets/location.png" alt="Location Icon" class="info-icon" />
                            <div class="info-text">
                                <span class="info-number">800+</span>
                                <span class="info-lebel">Cities</span>
                            </div>
                        </div>

                        <div class="info-item">
                            <img src="./assets/banner.png" alt="Order Icon" class="info-icon" />
                            <div class="info-text">
                                <span class="info-number">800+</span>
                                <span class="info-lebel">Cities</span>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </body>
</html>
